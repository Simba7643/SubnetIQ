openapi: 3.1.0
info:
  title: SubnetIQ REST and Streaming API
  version: 1.0.0
  description:
    'Guest mathematics and lookups; Supabase bearer-token persistence; typed assistant SSE. Requests
    accept application/json and are limited to 512 KiB, except project POST/PATCH envelopes (2.25 MiB) with
    a 2 MiB plan cap. Success bodies are returned directly. Failure bodies follow Error. API responses default
    to Cache-Control: no-store. Global quota is 180 requests/minute per IP identity. Production quotas are
    atomic PostgreSQL RPC calls. No credentials means honest guest mode in development; protected operations
    return 503. All ordinary user database access retains the verified user RLS context.'
servers:
  - url: http://localhost:3001
    description: Local API
  - url: /
    description: Current deployment
tags:
  - name: Operations
  - name: Calculations
  - name: Projects
  - name: Sharing
  - name: Lookups
  - name: Assistant
  - name: Learning
  - name: Accounts
paths:
  /api/health:
    get:
      operationId: get_health
      summary: Process liveness
      tags:
        - Operations
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: No external dependency check. Returns status ok.
  /api/ready:
    get:
      operationId: get_ready
      summary: Configuration and database readiness
      tags:
        - Operations
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description:
        Guest mode is ready without Supabase. PostgreSQL quota mode verifies the service cache RPC.
        No AI provider request is made.
  /api/calculate/{tool}:
    post:
      operationId: post_calculate_tool
      summary: Perform deterministic calculation
      tags:
        - Calculations
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description:
        Input shapes are documented in docs/implementation-contract.md and docs/calculation-semantics.md.
        The tool is calculated locally with the same pure engine used by the browser. 90 calculations per minute
        per identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      parameters:
        - name: tool
          in: path
          required: true
          schema:
            type: string
            enum: &id011
              - ipv4-subnet
              - ipv4-split
              - vlsm
              - aggregate
              - range-to-cidr
              - cidr-to-range
              - overlap
              - wildcard
              - convert
              - classify
              - reverse-dns
              - netmask-table
              - ipv6-subnet
              - ipv6-format
              - eui64
              - ipv6-plan
              - ipv4-map
              - bandwidth
              - mtu
              - mac
  /api/projects:
    get:
      operationId: get_projects
      summary: List own projects
      tags:
        - Projects
      security:
        - supabaseBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired Supabase bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - &id002
          name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
        - &id003
          name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
            maximum: 100000
    post:
      operationId: post_projects
      summary: Create a project
      tags:
        - Projects
      security:
        - supabaseBearer: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired Supabase bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
      description: Project request envelope is limited to 2.25 MiB; the plan JSON is limited to 2 MiB.
  /api/projects/{id}:
    get:
      operationId: get_projects_id
      summary: Read own project
      tags:
        - Projects
      security:
        - supabaseBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired Supabase bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema: &id001
            type: string
            format: uuid
    patch:
      operationId: patch_projects_id
      summary: Atomically update and version a project
      tags:
        - Projects
      security:
        - supabaseBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired Supabase bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Stale version; reload before saving.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description:
        version is the expected current version. The database captures the previous snapshot and
        increments version in the same transaction. The project request envelope is limited to 2.25 MiB and
        plan JSON to 2 MiB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProject'
      parameters:
        - name: id
          in: path
          required: true
          schema: *id001
    delete:
      operationId: delete_projects_id
      summary: Delete own project and its children
      tags:
        - Projects
      security:
        - supabaseBearer: []
      responses:
        '204':
          description: Deleted or revoked; response body is empty.
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired Supabase bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
        - name: id
          in: path
          required: true
          schema: *id001
  /api/projects/{id}/revisions:
