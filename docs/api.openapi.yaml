              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired Supabase bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: Avatar must be within the caller UUID prefix. Preferences are limited to 8,000 JSON characters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                avatar_path:
                  type:
                    - string
                    - 'null'
                  maxLength: 300
                preferences:
                  type: object
                  additionalProperties: true
              additionalProperties: false
  /api/feedback:
    post:
      operationId: post_feedback
      summary: Record product feedback
      tags:
        - Accounts
      security:
        - {}
        - supabaseBearer: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: *id001
                  created_at:
                    type: string
                    format: date-time
                required:
                  - id
                  - created_at
                additionalProperties: false
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description:
        Optional authentication. Guest feedback requires the server service key. Five submissions/hour.
        Returns success only after a real database write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  minLength: 10
                  maxLength: 5000
                email:
                  type: string
                  format: email
                  maxLength: 254
              required:
                - message
              additionalProperties: false
  /api/account/export:
    get:
      operationId: get_account_export
      summary: Export own account records
      tags:
        - Accounts
      security:
        - supabaseBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired Supabase bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Interactive export limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description:
        JSON attachment includes all owned records and identity metadata, excluding share token
        hashes. Bearer tokens/provider keys are never included. Pagination is performed internally. Exports
        above 25 MiB or 50,000 rows per table fail explicitly rather than truncating; use paginated endpoints
        or an operator-assisted export.
  /api/account:
    delete:
      operationId: delete_account
      summary: Remove owned storage, account and records
      tags:
        - Accounts
      security:
        - supabaseBearer: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  removedFiles:
                    type: integer
                required:
                  - deleted
                  - removedFiles
                additionalProperties: false
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing, invalid, or expired Supabase bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description:
        Deletes objects only below the verified UUID in private exports/avatars buckets, purges
        the user HMAC quota subject, then deletes the Auth user, cascading owned database rows. Requires the
        server service key. Partial cleanup failures are reported honestly; retries complete remaining work.
components:
  securitySchemes:
    supabaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Supabase access JWT
      description:
        A verified Supabase access token; API calls auth.getUser to verify it before creating a
        user-scoped database client.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id004
            message: *id004
            requestId: *id004
            details: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    CalculationResult:
      type: object
      properties:
        toolId: *id004
        title: *id004
        normalizedInput:
          type: object
          additionalProperties: true
        summary:
          type: array
          items:
            type: object
            properties:
              label: *id004
              value:
                type:
                  - string
                  - number
                  - boolean
                  - 'null'
              description: *id004
            required:
              - label
              - value
            additionalProperties: false
        rows:
          type: array
          items:
            type: object
            additionalProperties:
              type:
                - string
                - number
                - boolean
                - 'null'
        columns:
          type: array
          items:
            type: object
            properties:
              key: *id004
              label: *id004
            required:
              - key
              - label
            additionalProperties: false
        steps:
          type: array
          items:
            type: object
            properties:
              title: *id004
              description: *id004
              formula: *id004
            required:
              - title
              - description
            additionalProperties: false
        warnings:
          type: array
          items: *id004
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        data:
          type: object
          additionalProperties: true
        sources:
          type: array
          items:
            type: string
            format: uri
        engineVersion: *id004
      required:
        - toolId
        - title
        - normalizedInput
        - summary
        - steps
        - warnings
        - engineVersion
      additionalProperties: false
    Project:
      type: object
      properties:
        id: *id001
        name: &id005
          type: string
          minLength: 1
          maxLength: 100
        description: &id006
          type: string
          maxLength: 3000
        address_space: &id007
          type: string
          maxLength: 100
        plan: &id008
          type: object
          additionalProperties: true
        version: &id010
          type: integer
          minimum: 1
        archived: &id009
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - description
        - address_space
        - plan
        - version
        - created_at
        - updated_at
      additionalProperties: true
    CreateProject:
      type: object
      properties:
        name: *id005
        description: *id006
        address_space: *id007
        plan: *id008
        archived: *id009
      required:
        - name
      additionalProperties: false
    UpdateProject:
      type: object
      properties:
        name: *id005
        description: *id006
        address_space: *id007
        plan: *id008
        version: *id010
        archived: *id009
      required:
        - version
      additionalProperties: false
    Revision:
      type: object
      properties:
        id: *id001
        project_id: *id001
        name: *id004
        snapshot:
          $ref: '#/components/schemas/Project'
        created_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - snapshot
        - created_at
      additionalProperties: false
    Share:
      type: object
      properties:
        id: *id001
        project_id: *id001
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type:
            - string
            - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - expires_at
        - created_at
      additionalProperties: false
    NewShare:
      type: object
      properties:
        id: *id001
        token:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
        url:
          type: string
          description: Relative /share/{token} path. Token is returned only on creation.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        - id
        - token
        - url
        - expires_at
      additionalProperties: false
    SavedCalculation:
      type: object
      properties:
        id: *id001
        project_id:
          type:
            - string
            - 'null'
          format: uuid
        name: *id004
        tool_id:
          type: string
          enum: *id011
        input:
          type: object
          additionalProperties: true
        result:
          $ref: '#/components/schemas/CalculationResult'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - tool_id
        - input
        - result
      additionalProperties: false
    CreateCalculation:
      type: object
      properties:
        tool_id:
          type: string
          enum: *id011
        name:
          type: string
          minLength: 1
          maxLength: 100
        title:
          type: string
          description: Compatibility alias for name.
          minLength: 1
          maxLength: 100
        project_id:
          type:
            - string
            - 'null'
          format: uuid
        input:
          type: object
          additionalProperties: true
        result:
          description:
            Accepted for client compatibility; the API ignores this field and recomputes results
            from input.
      required:
        - tool_id
        - input
      additionalProperties: false
    Favorite:
      type: object
      properties:
        id: *id001
        tool_id: *id004
        label: *id004
        created_at:
          type: string
          format: date-time
      required:
        - id
        - tool_id
      additionalProperties: false
    ChatMessage:
      type: object
      properties:
        id: *id001
        role:
          type: string
          enum:
            - user
            - assistant
        content:
          type: string
          minLength: 1
          maxLength: 16000
        provider: *id004
        mode:
          type: string
          enum:
            - live
            - demo
            - mock
        created_at:
          type: string
          format: date-time
      required:
        - role
        - content
      additionalProperties: false
    ChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 30
          items:
            type: object
            properties:
              role:
                type: string
                enum:
                  - user
                  - assistant
              content:
                type: string
                minLength: 1
                maxLength: 16000
            required:
              - role
              - content
            additionalProperties: false
        context:
          type: object
          description:
            A CalculationResult with toolId and normalizedInput, or {toolId,input}. The API recomputes
            the attachment; arbitrary context is rejected.
          additionalProperties: true
        conversationId: *id001
      required:
        - messages
      additionalProperties: false
    Conversation:
      type: object
      properties:
        id: *id001
        title: *id004
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - created_at
      additionalProperties: false
    QuizAttemptInput:
      type: object
      properties:
        questionId:
          type: string
          minLength: 1
          maxLength: 150
        answerIndex:
          type: integer
          minimum: 0
          maximum: 7
        topic:
          type: string
          minLength: 1
          maxLength: 100
        difficulty:
          type: string
          enum:
            - beginner
            - intermediate
            - advanced
            - exam
        durationMs:
          type: integer
          minimum: 0
          maximum: 86400000
        seed:
          type:
            - string
            - integer
      required:
        - questionId
        - answerIndex
        - topic
        - difficulty
        - durationMs
      additionalProperties: false
    PracticeStats:
      type: object
      properties:
        topic: *id004
        difficulty: *id004
        attempts:
          type: integer
        correct_answers:
          type: integer
        total_duration_ms:
          type: integer
        best_streak:
          type: integer
        current_streak:
          type: integer
        last_practiced_at:
          type: string
          format: date-time
      required:
        - topic
        - difficulty
        - attempts
        - correct_answers
      additionalProperties: false
    Profile:
      type: object
      properties:
        id: *id001
        display_name: *id004
        avatar_path:
          type:
            - string
            - 'null'
        preferences:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - display_name
        - preferences
      additionalProperties: false
