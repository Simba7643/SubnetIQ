  /api/ai/chat:
    post:
      operationId: post_ai_chat
      summary: Stream assistant output
      tags:
        - Assistant
      security:
        - {}
        - supabaseBearer: []
      responses:
        '200':
          description: SSE stream; inspect the error event because HTTP headers are already sent.
          content:
            text/event-stream:
              schema:
                type: string
              example: 'data: {"type":"meta","provider":"mock","mode":"demo","persisted":false}


                data: {"type":"delta","content":"AI not configured — demo response"}


                data: {"type":"done","provider":"mock","mode":"demo"}


                '
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Quota exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry.
        '503':
          description: Required credentials, migrations, or service are unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description:
        'Optional bearer token. Guests always receive a deterministic labeled demo. Live OpenAI
        requires verified authentication and server service configuration. Sum of message content is limited
        to 48,000 characters. The last message must be user. Saved conversation history is loaded through RLS.
        SSE data JSON types: meta, delta, done, error. meta includes provider, mode, conversationId when saved,
        and persisted. Deltas use content. In-stream errors use code/message. Stop the request to cancel generation.
        Demo responses are not live AI. Anthropic/Gemini adapters are unimplemented. Quotas count request attempts;
        provider usage is recorded when returned.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
