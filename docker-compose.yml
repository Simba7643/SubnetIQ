name: subnetiq
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: ${API_NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: '3001'
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080}
      TRUST_PROXY_HOPS: '1'
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      QUOTA_STORE: ${QUOTA_STORE:-memory}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1200}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      LOOKUP_TIMEOUT_MS: ${LOOKUP_TIMEOUT_MS:-7000}
      LOOKUP_MAX_CONCURRENT: ${LOOKUP_MAX_CONCURRENT:-8}
      WHOIS_FALLBACK_ENABLED: ${WHOIS_FALLBACK_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - '3001'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        VITE_APP_NAME: ${VITE_APP_NAME:-SubnetIQ}
        VITE_ANALYTICS_PROVIDER: ${VITE_ANALYTICS_PROVIDER:-none}
        VITE_ANALYTICS_DOMAIN: ${VITE_ANALYTICS_DOMAIN:-}
        VITE_ANALYTICS_SCRIPT_URL: ${VITE_ANALYTICS_SCRIPT_URL:-}
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
