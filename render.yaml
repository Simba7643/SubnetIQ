services:
  - type: web
    name: subnetiq-api
    runtime: node
    plan: free
    buildCommand: npm install --global pnpm@11.25.0 && pnpm install --frozen-lockfile --prod=false && pnpm build:packages && pnpm --filter @subnetiq/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - apps/api/**
        - packages/**
        - data/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.base.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: HUSKY
        value: '0'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: WEB_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: QUOTA_STORE
        value: postgres
      - key: RATE_LIMIT_SECRET
        generateValue: true
      - key: AI_PROVIDER
        value: mock
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: AI_MAX_OUTPUT_TOKENS
        value: '1200'
      - key: AI_DAILY_LIMIT
        value: '30'
      - key: AI_TIMEOUT_MS
        value: '60000'
      - key: LOOKUP_TIMEOUT_MS
        value: '7000'
      - key: LOOKUP_MAX_CONCURRENT
        value: '8'
      - key: WHOIS_FALLBACK_ENABLED
        value: 'false'
      - key: LOG_LEVEL
        value: info
