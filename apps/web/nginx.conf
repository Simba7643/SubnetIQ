worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format operational '$time_iso8601 "$request_method" $status $body_bytes_sent $request_time';
  access_log /dev/stdout operational;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 512k;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  map $request_uri $cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/(auth|login|account|projects|share|assistant)(/|[?]|$) "no-store";
    ~^/api/ "";
  }

  map $request_uri $robots_policy {
    default "";
    ~^/(auth|login|account|projects|share|assistant)(/|[?]|$) "noindex, noarchive";
  }

  map $request_uri $referrer_policy {
    default "strict-origin-when-cross-origin";
    ~^/share(/|[?]|$) "no-referrer";
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag $robots_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy $referrer_policy always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https:" always;

    location = /healthz {
      default_type text/plain;
      return 200 "ok\n";
    }

    location /api/ {
      client_max_body_size 2304k;
      set $api_upstream http://api:3001;
      proxy_pass $api_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_cache off;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 190s;
      gzip off;
    }

    location /assets/ {
      try_files $uri =404;
    }

    location ~ ^/(auth|login|account|projects|share|assistant)(/|[?]|$) {
      try_files $uri $uri/ /index.html;
    }

    location = /404.html {
      internal;
    }

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
