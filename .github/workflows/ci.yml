name: Quality and release
on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared packages
        run: pnpm build:packages
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Browser test TypeScript
        run: pnpm test:e2e:typecheck
      - name: Lint
        run: pnpm lint
      - name: Formatting
        run: pnpm format:check
      - name: Validate content and reference data
        run: pnpm test:data
      - name: Math and frontend tests with coverage
        run: pnpm test:coverage
      - name: Backend tests
        run: pnpm --filter @subnetiq/api test
      - name: Database schema and policy tests
        run: pnpm test:db:wasm
      - name: Build production artifacts
        run: pnpm build
      - name: Install browser test dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser workflows
        run: pnpm test:e2e:production
      - name: Package reviewable source archives
        run: pnpm package:release
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification-reports
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload source release
        uses: actions/upload-artifact@v7
        with:
          name: subnetiq-source-release
          path: release/
          if-no-files-found: error
          retention-days: 30
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and start the guest-mode composition
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check web, API, and static routing
        run: |
          curl --fail --silent --show-error http://localhost:8080/healthz
          curl --fail --silent --show-error http://localhost:8080/api/ready
          curl --fail --silent --show-error --output /dev/null http://localhost:8080/tools/ipv4-subnet
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/missing-route)" = "404"
      - name: Print container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=100
      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
